# Debian bookworm supplies tmux 3.3a (pre-CSI-u configuration).
# Avoid the default 500 ms delay before forwarding a standalone Escape key.
set -s escape-time 10
set -g extended-keys on
set -g default-terminal "tmux-256color"
# Enable pane selection, resizing, and scrolling with the mouse.
set -g mouse on
# Keep the foreground server alive even after the last session is closed.
set -g exit-empty off
# -D keeps tmux in the foreground and cannot take a command argument.
# Create only a shell when the server starts; never replay Pi requests.
new-session -d -s shell -c /workspace
