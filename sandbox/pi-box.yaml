# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Pi Box
description: Persistent mountless Pi development environment with in-sandbox Codex login
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/long-running@1
  - type: com.docker.sandbox/resources@1
    config:
      cpu: 4
      memory: 4g
  # Outbound networking follows the host's allow-all policy; no project allowlist.
  # No model credential capability: Pi /login owns its persistent auth.json.
  # GitHub proxy credentials come from sbx's built-in shell identity. The
  # compatibility creation path must not redeclare that service.
