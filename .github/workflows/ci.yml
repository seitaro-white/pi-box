name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Stop obsolete work on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Node.js host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Host tests use only Node.js built-ins; no npm install is needed.
      - name: Run host tests
        run: npm test

  container-tests:
    name: Containers (${{ matrix.arch }})
    needs: host-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Keep the other architecture running if one fails, for useful diagnostics.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Native runners, not QEMU. One builder shares common layers between targets.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          platforms: linux/${{ matrix.arch }}
          tags: pi-box:ci-base
          load: true
          push: false
          cache-from: type=gha,scope=pi-box-${{ matrix.arch }}-base
          cache-to: type=gha,scope=pi-box-${{ matrix.arch }}-base,mode=max

      - name: Smoke-test base image
        run: PI_BOX_PROFILE=base PI_BOX_IMAGE=pi-box:ci-base node tests/smoke.mjs

      - name: Build recommended image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: recommended
          platforms: linux/${{ matrix.arch }}
          tags: pi-box:ci-recommended
          load: true
          push: false
          cache-from: type=gha,scope=pi-box-${{ matrix.arch }}-recommended
          cache-to: type=gha,scope=pi-box-${{ matrix.arch }}-recommended,mode=max

      - name: Smoke-test recommended image
        run: PI_BOX_PROFILE=recommended PI_BOX_IMAGE=pi-box:ci-recommended node tests/smoke.mjs

      - name: Verify Compose lifecycle and migration
        run: PI_BOX_RECOMMENDED_IMAGE=pi-box:ci-recommended node tests/compose.mjs
