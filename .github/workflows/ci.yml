name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Stop obsolete work on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Node.js host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  container-tests:
    name: Containers (${{ matrix.arch }})
    needs: host-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Keep the other architecture running if one fails, for useful diagnostics.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      # Runner-provided Compose can lag: start --wait requires Compose v5.0+.
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2
        with:
          version: v5.6.0

      # Native runners, not QEMU. One builder shares common layers between targets.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: base
          platforms: linux/${{ matrix.arch }}
          tags: pi-box:ci-base
          load: true
          push: false
          cache-from: type=gha,scope=pi-box-${{ matrix.arch }}-base
          cache-to: type=gha,scope=pi-box-${{ matrix.arch }}-base,mode=max

      - name: Build recommended image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: recommended
          platforms: linux/${{ matrix.arch }}
          tags: pi-box:ci-recommended
          load: true
          push: false
          cache-from: type=gha,scope=pi-box-${{ matrix.arch }}-recommended
          cache-to: type=gha,scope=pi-box-${{ matrix.arch }}-recommended,mode=max

      # .dockerignore restricts build inputs; no sbx, KVM, or login required.
      - name: Build sandbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: sandbox
          platforms: linux/${{ matrix.arch }}
          tags: pi-box:ci-sandbox
          load: true
          push: false
          cache-from: type=gha,scope=pi-box-${{ matrix.arch }}-sandbox
          cache-to: type=gha,scope=pi-box-${{ matrix.arch }}-sandbox,mode=max

      # Use the same suite selection as local development; Phoenix is opt-in.
      - name: Run disposable Docker acceptance
        env:
          PI_BOX_BASE_IMAGE: pi-box:ci-base
          PI_BOX_RECOMMENDED_IMAGE: pi-box:ci-recommended
          PI_BOX_SANDBOX_IMAGE: pi-box:ci-sandbox
        run: npm run test:integration
