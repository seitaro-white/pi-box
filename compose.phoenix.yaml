# Select with COMPOSE_FILE=compose.yaml:compose.phoenix.yaml in your local .env.
# Backend only: install/configure pi-otel explicitly in the opted-in Pi environment.
services:
  phoenix:
    # Tested multi-architecture release; do not replace with a floating tag.
    image: docker.io/arizephoenix/phoenix:version-20.23.0@sha256:c542e7de1dc1fdd0f938de337d44ebefa7266e91391eed6e7978523d7f6e1f2f
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # No external SQL configuration: Phoenix uses SQLite in this directory.
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix:/mnt/data
    ports:
      - "127.0.0.1:${PHOENIX_UI_PORT:-6006}:6006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

# Compose scopes SQLite storage by project (default: pi-box_phoenix).
volumes:
  phoenix: {}
